name: Label posting sentences (teacher step)

# The inference engine's teacher step. Gemini labels sentences from PUBLIC job postings with the
# skills they show (plus certificates and degrees, and a CV-style rewrite). Our own model learns
# from these labels later. No CV text is ever sent: see tools/build_pool.cjs and tools/label_sentences.py.
#
# Uses its own key, GEMINI_LABEL_KEY, in its own Google project, so it never uses up the weekly
# agent's free allowance. Resumable: each run carries on where the last one stopped.
# Manual only for now; a nightly schedule is added after the 500-sentence trial is checked.

on:
  # Every day just after Google's free allowance resets (midnight Pacific = 08:00 UTC in winter):
  # the three votes on the 20,000 sentences carry on until they are done, then the runs find nothing to do.
  # Three tries a day: GitHub sometimes starts scheduled runs hours late (Nov 23: 12 hours), and Google is
  # sometimes busy. A try that finds the allowance used up, or nothing left to do, ends within minutes.
  schedule:
    - cron: "17 8 * * *"
    - cron: "17 14 * * *"
    - cron: "17 20 * * *"
  workflow_dispatch:
    inputs:
      votes:
        description: "Run the three votes on the 20,000 sentences (ignores the options below)"
        type: boolean
        required: false
        default: false
      limit:
        description: "How many sentences to label this run"
        required: false
        default: "500"
      out:
        description: "Folder for the answers (labels = the main set; another folder for a second opinion)"
        required: false
        default: "labels"
      model:
        description: "Model to use first (empty = the cheapest available)"
        required: false
        default: ""
      batch:
        description: "Sentences per request"
        required: false
        default: "20"
      pause:
        description: "Seconds between requests (keep under the model's per-minute limit)"
        required: false
        default: "5"

permissions:
  contents: write

concurrency:
  group: label
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install scikit-learn==1.5.2

      # The sentence pool takes a while to build and only changes with the frozen site copy: keep it.
      - name: Sentence pool (cached)
        id: pool
        uses: actions/cache@v4
        with:
          path: pool.jsonl
          key: pool-${{ hashFiles('gaps-after/jobs.json', 'gaps-after/skills.json', 'tools/build_pool.cjs') }}
      - name: Build the sentence pool
        if: steps.pool.outputs.cache-hit != 'true'
        run: node tools/build_pool.cjs gaps-after pool.jsonl

      # The 20,000-sentence set, in three votes. Each vote keeps to its own model (no fallback), so the votes
      # are independent; a skill counts for training when 2 of the 3 agree. Vote 3 only reads the sentences
      # where votes 1 and 2 disagree. Each stops cleanly at its model's daily allowance and resumes next day.
      - name: "Vote 1: Gemini 3.5 Flash Lite"
        if: github.event_name == 'schedule' || github.event.inputs.votes == 'true'
        env:
          GEMINI_LABEL_KEY: ${{ secrets.GEMINI_LABEL_KEY }}
        run: >
          python3 tools/label_sentences.py --pool pool.jsonl --site gaps-after --pairs infer-after/skill_pairs.json
          --out labels --total 20000 --limit 10000 --model gemini-3.5-flash-lite --only-model --max-minutes 90
      - name: "Save after vote 1"
        if: always() && (github.event_name == 'schedule' || github.event.inputs.votes == 'true')
        run: bash tools/save_labels.sh

      - name: "Vote 2: Gemini 3.1 Flash Lite"
        if: always() && (github.event_name == 'schedule' || github.event.inputs.votes == 'true')
        env:
          GEMINI_LABEL_KEY: ${{ secrets.GEMINI_LABEL_KEY }}
        run: >
          python3 tools/label_sentences.py --pool pool.jsonl --site gaps-after --pairs infer-after/skill_pairs.json
          --out labels-second --total 20000 --limit 10000 --model gemini-3.1-flash-lite --only-model --max-minutes 90
      - name: "Save after vote 2"
        if: always() && (github.event_name == 'schedule' || github.event.inputs.votes == 'true')
        run: bash tools/save_labels.sh

      - name: "Vote 3: Gemini 3.5 Flash Lite again, only where votes 1 and 2 disagree"
        if: always() && (github.event_name == 'schedule' || github.event.inputs.votes == 'true')
        env:
          GEMINI_LABEL_KEY: ${{ secrets.GEMINI_LABEL_KEY }}
        run: >
          python3 tools/label_sentences.py --pool pool.jsonl --site gaps-after --pairs infer-after/skill_pairs.json
          --out labels-third --total 20000 --limit 10000 --model gemini-3.5-flash-lite --only-model --batch 25 --max-minutes 90
          --only-disagree labels/labels.jsonl labels-second/labels.jsonl

      - name: "Save after vote 3"
        if: always() && (github.event_name == 'schedule' || github.event.inputs.votes == 'true')
        run: bash tools/save_labels.sh

      - name: Label with Gemini
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.votes != 'true'
        env:
          GEMINI_LABEL_KEY: ${{ secrets.GEMINI_LABEL_KEY }}
        run: >
          python3 tools/label_sentences.py --pool pool.jsonl --site gaps-after
          --pairs infer-after/skill_pairs.json --out "${{ github.event.inputs.out || 'labels' }}" --limit "${{ github.event.inputs.limit || '500' }}"
          --model "${{ github.event.inputs.model }}" --batch "${{ github.event.inputs.batch || '20' }}"
          --pause "${{ github.event.inputs.pause || '5' }}"

      # saved even when the labelling step stopped on an error, so finished answers are never lost
      - name: Save the labels
        if: always()
        run: bash tools/save_labels.sh

name: Draft skills for approval

# I-19's agent. Reads the phrases many postings ask for that our dictionary does not know, asks
# Gemini which of them are real skills, and opens a pull request with the drafts for a person to
# approve. It never changes skills.json: approval is a human step, as with the credentials map.
#
# Only public posting vocabulary is sent. No CV text, ever.

on:
  schedule:
    - cron: "0 7 * * 1"          # Monday morning, after the weekend's collection
  workflow_dispatch:
    inputs:
      limit:
        description: "How many phrases to judge this run"
        required: false
        default: "40"

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh the queue of unknown phrases
        run: node --max-old-space-size=4000 tools/unknown_report.js after-6 20

      - name: Draft entries
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node tools/draft_skills.mjs ${{ github.event.inputs.limit || '40' }}

      - name: Open a pull request if anything was drafted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- tools/skill_proposals.json tools/skill_proposals.md; then
            echo "nothing new to propose"
            exit 0
          fi
          BRANCH="skills-draft-$(date +%Y-%m-%d)"
          git config user.name "skills-agent"
          git config user.email "noreply@anthropic.com"
          git checkout -b "$BRANCH"
          git add tools/skill_proposals.json tools/skill_proposals.md tools/unknown_skills.json
          git commit -m "Skills drafted for approval, $(date +%Y-%m-%d)"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "Skills drafted for approval, $(date +%Y-%m-%d)" \
            --body "$(cat <<'EOF'
The agent read the phrases many postings ask for that `skills.json` does not know, and drafted the
ones it thinks are real skills.

**Nothing in this PR changes the matching.** It adds proposals only. Read
`tools/skill_proposals.md`, tick the ones to add, and they go into the dictionary in a separate
change.

Each row carries its evidence: how many postings asked, how many kinds of job, and one real posting,
so no proposal has to be taken on trust. The list of phrases it called *not* a skill is at the
bottom of the same file — if any of those is wrong, the prompt needs work, which is worth knowing.
EOF
)" \
            --base main --head "$BRANCH"
